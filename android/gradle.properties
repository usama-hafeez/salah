org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 defaults to a new DSL that the current Flutter Gradle plugin can't read
# yet; opt back into the legacy DSL until Flutter supports it.
android.newDsl=false
# Disable AGP 9's built-in Kotlin so the legacy kotlin-android plugin (still used
# by the app and many Flutter plugins, e.g. audio_session) keeps working without
# the "extension 'kotlin' already registered" clash.
android.builtInKotlin=false
